name: Build and deploy

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  image:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          if [ "$GITHUB_REF_NAME" = staging ]; then
            tags="$image:staging,$image:staging-$GITHUB_SHA"
          else
            tags="$image:latest,$image:$GITHUB_SHA"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL secret is not set, cannot deploy"
            exit 1
          fi
          curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"

  deploy-staging:
    needs: image
    if: github.event_name != 'pull_request' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify staging deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "::error::COOLIFY_STAGING_WEBHOOK_URL secret is not set, cannot deploy"
            exit 1
          fi
          curl --fail --silent --show-error -X GET "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_TOKEN"
